[package]
name = "obscura"
version = "0.1.0"
edition = "2021"
description = "Rust API for the Obscura headless browser"
readme = "README.md"
repository = "https://github.com/h4ckf0r0day/obscura"
license = "Apache-2.0"

[features]
default = ["api"]
api = ["obscura-browser", "obscura-net", "tokio"]
render = ["api", "obscura-browser/render"]

[dependencies]
# Not `workspace = true`, so these carry their own default-features = false --
# same reason as the workspace entries: the facade's `stealth` feature has to be
# the only thing that turns BoringSSL on, or downstream cannot turn it off.
obscura-browser = { path = "../obscura-browser", optional = true, default-features = false }
obscura-net = { path = "../obscura-net", optional = true, default-features = false }
anyhow = "1"
tokio = { version = "1", features = ["rt"], optional = true }
thiserror = "1"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
url = "2"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
